packages:
  - "."

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  core-js-pure: true
  msw: true
  prisma: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - unrs-resolver

patchedDependencies:
  '@types/jest@30.0.0': patches/@types__jest@30.0.0.patch
  jest-runtime@30.3.0: patches/jest-runtime@30.3.0.patch
